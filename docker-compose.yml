services:
  api-gateway:
    build: .
    ports:
      - "8080:80"
    environment:
      HTTP_ADDR: ":80"
      AUTH_SERVICE_URL: "http://auth-service:8080"
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
      CART_SERVICE_URL: "http://cart-service:8080"
      ORDER_SERVICE_URL: "http://order-service:8080"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "text"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      RATE_LIMIT_RPS: "100"
      JWKS_REFRESH_INTERVAL: "5m"
      UPSTREAM_TIMEOUT: "10s"
      OTEL_ENABLED: "false"
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
    restart: unless-stopped

  # --- Stub upstreams for local development ---
  # Replace with real service images when available.

  auth-service:
    image: kennethreitz/httpbin
    ports:
      - "8081:80"

  catalog-service:
    image: kennethreitz/httpbin
    ports:
      - "8082:80"

  cart-service:
    image: kennethreitz/httpbin
    ports:
      - "8083:80"

  order-service:
    image: kennethreitz/httpbin
    ports:
      - "8084:80"
