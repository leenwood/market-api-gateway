version: '3'

vars:
  BINARY: bin/gateway
  MODULE: market-api-gateway

tasks:
  build:
    desc: Build the gateway binary
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o {{.BINARY}} ./cmd/gateway
    generates:
      - "{{.BINARY}}"

  run:
    desc: Run the gateway (requires env vars set)
    deps: [build]
    cmds:
      - ./{{.BINARY}}

  test:
    desc: Run unit tests with race detector
    cmds:
      - go test -race -count=1 -timeout=60s ./...

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -race -count=1 -timeout=120s -tags=integration ./...

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run ./...

  arch:
    desc: Check architecture compliance
    cmds:
      - go tool go-arch-lint check

  arch:graph:
    desc: Generate architecture dependency graph
    cmds:
      - go tool go-arch-lint graph

  fmt:
    desc: Format code with goimports
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  docker:up:
    desc: Start local docker-compose environment
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop local docker-compose environment
    cmds:
      - docker compose down

  docker:reset:
    desc: Reset local docker-compose environment
    cmds:
      - docker compose down -v
      - docker compose up -d
